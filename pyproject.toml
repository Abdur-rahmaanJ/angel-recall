[project]
name = "angel-recall"
version = "0.3.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentor>=0.0.21",
    "chromadb>=1.5.0",
    "langchain>=1.2.10",
    "langchain-litellm>=0.5.1",
    "langgraph>=1.0.8",
    "litellm>=1.81.10",
    "networkx>=3.4.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
angel-recall = "angel_recall.cli:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
